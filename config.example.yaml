server:
  listen: ":18089"
  # 同时处理的 /v1/* 请求数上限；0 或不填表示使用默认值 1024。
  max_concurrency: 1024

catalog:
  # 模型目录快照；相对路径基于 config.yaml 所在目录。留空不写快照。
  snapshot: "state/models.json"
  # 目录刷新间隔；默认 5m。
  refresh: "5m"
  # raw = 原样展示上游 id；openai = 只展示基础模型；both = 两者都展示。
  model_mode: "openai"
  # 从 family metadata 自动生成基础模型和档位建议。
  auto_tiers: true

debug:
  # 开启后每个请求在 config.yaml 同目录的 logs/<时间>/ 下留一份调试记录。
  enabled: false

devin:
  base_url: "https://server.codeium.com"
  token: "devin-session-token$..."
  # model: "swe-1-7"
  model: "glm-5-2"
  # 代理地址（可选），支持 http:// 与 https://；留空则直连或走系统代理环境变量。
  proxy: ""
  # 强制 HTTP/1.1：每请求独立 TCP 连接，避免 HTTP/2 多 stream 复用被上游串行处理。
  force_http1: true
  # 上游流两次帧之间的最长等待时间；超时返回 504。0 表示不限制。
  stream_idle_timeout: "5m"
  # 推理档位映射：客户端传 model=swe-2 + reasoning_effort=high 时，
  # 实际发给上游的模型是 swe-2-high。未配置的模型保持原样。
  reasoning_tiers:
    swe-2:
      medium: swe-2-medium
      high: swe-2-high
      max: swe-2-max
    glm-5-3:
      low: glm-5-3-low
      high: glm-5-3-high

auth:
  # /v1/* 的访问密钥；留空则不校验。客户端可用 Authorization: Bearer 或 X-Api-Key。
  api_key: ""

# 环境变量优先级高于本文件，适合容器 / systemd：
#   SERVER_LISTEN, SERVER_MAX_CONCURRENCY
#   DEVIN_BASE_URL, DEVIN_TOKEN, DEVIN_MODEL, DEVIN_PROXY,
#   DEVIN_FORCE_HTTP1, DEVIN_STREAM_IDLE_TIMEOUT
#   DEBUG_ENABLED, AUTH_API_KEY
#   CATALOG_SNAPSHOT, CATALOG_REFRESH
